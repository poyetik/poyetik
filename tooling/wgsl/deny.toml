# Supply-chain policy of the WGSL tools workspace (cargo-deny): the root's (deny.toml), without
# its libm feature ban (no engine crate is built here), with the exceptions of naga's tree.
# Exactly what xtask builds from the root's (`wgsl_deny_config`).
[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  # unicode-ident (a build-time dependency of serde's derive macros): the permissive
  # license of the Unicode data tables.
  "Unicode-3.0",
]
confidence-threshold = 0.93
private = { ignore = true }

[advisories]
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# naga's tree: foldhash (hashbrown's hasher) is Zlib, permissive; allowed for that crate only.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

# naga's tree holds two versions of syn, which this workspace cannot choose: zerocopy-derive's
# (through half) beside thiserror-impl's. The older is skipped, at its exact version.
[[bans.skip]]
crate = "syn@2.0.119"
