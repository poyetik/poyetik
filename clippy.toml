  { path = "std::time::Instant::now", reason = "the engine counts time in samples" },
  { path = "std::time::SystemTime::now", reason = "the engine counts time in samples" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "random iteration order: use BTreeMap" },
  { path = "std::collections::HashSet", reason = "random iteration order: use BTreeSet" },
]
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-unwrap-in-tests = false
allow-print-in-tests = false
allow-dbg-in-tests = false

# Single-letter names allowed by min_ident_chars: the conventional loop and coordinate
# names only. Everything else says what it holds (`error`, not `e`). One exemption comes
# from Clippy itself: the parameters of a trait implementation may keep the names the
# trait declares (`f` in `Display::fmt`), which min_ident_chars does not flag.
allowed-idents-below-min-chars = ["i", "j", "x", "y"]
