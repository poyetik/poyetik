# Determinism rules: the same samples, bit for bit, on every target. Enforced on every crate.
# Every f32/f64 method whose result may differ between targets is banned: not correctly
# rounded by IEEE 754, documented as non-deterministic (the sign of a zero from max, min and
# clamp; the precision of to_degrees), reassociated by the compiler, or in native byte order.
# `cargo xtask check` audits this list against the standard library's sources: every float
# method the pinned release has stabilized is banned here or reviewed as deterministic in xtask
# (DETERMINISTIC_FLOAT_METHODS). Most of these methods do not exist in the no_std engine
# crates; the list covers every crate.
disallowed-methods = [
  { path = "std::env::args", reason = "panics on an argument that is not Unicode: read std::env::args_os and refuse such an argument as a usage error (CLAUDE.md, command-line tools)" },
  { path = "f32::sin", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::cos", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::tan", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::asin", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::acos", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::atan", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::atan2", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::sin_cos", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::sinh", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::cosh", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::tanh", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::asinh", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::acosh", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::atanh", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::exp", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::exp2", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::exp_m1", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::ln", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::log", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::log2", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::log10", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::ln_1p", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::powf", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::powi", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::cbrt", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::hypot", reason = "not correctly rounded: results may differ between targets; use libm" },
  { path = "f32::mul_add", reason = "relies on the platform fma where there is no hardware FMA (and is slow in WebAssembly); write the product and the sum" },
  { path = "f32::max", reason = "returns either value when they compare equal (+0 and -0): the sign of a zero may differ; compare and select" },
  { path = "f32::min", reason = "returns either value when they compare equal (+0 and -0): the sign of a zero may differ; compare and select" },
  { path = "f32::clamp", reason = "may return either zero when its bounds and the value are zeros of different signs; compare and select" },
  { path = "f32::to_degrees", reason = "unspecified precision: results may differ between targets; multiply by the constant" },
  { path = "f32::to_radians", reason = "unspecified precision: results may differ between targets; multiply by the constant" },
  { path = "f32::abs_sub", reason = "calls the platform math library (fdim): results may differ between targets; write the difference and the comparison" },
  { path = "f32::algebraic_add", reason = "allows the compiler to reassociate: results may differ between targets and builds; write the plain operation" },
