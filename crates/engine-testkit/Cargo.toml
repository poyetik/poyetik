[package]
name = "engine-testkit"
description = "Poyetik test bench: runs boxes in isolation and checks the generic laws every box must respect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["audio", "testing"]
categories = ["development-tools::testing"]

[dependencies]
engine-alloc-counter = { path = "../engine-alloc-counter" }
engine-core = { path = "../engine-core" }
libm = { workspace = true }
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = { workspace = true }

[dev-dependencies]
# The patch reader and the real boxes, for the laws of reading patches (tests/parse_laws.rs).
engine-objects = { path = "../engine-objects" }
engine-patch = { path = "../engine-patch" }
serde_json = "1"

[lints]
workspace = true
