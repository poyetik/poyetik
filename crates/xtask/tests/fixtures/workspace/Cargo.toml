# A workspace of its own, outside the project's, of manifests only: xtask's tests read what
# the real `cargo metadata --no-deps` says of it. Its crates take the names and places of the
# project's, and hold what each gate reading the metadata must refuse.
[workspace]
members = [
    "crates/audio-core",
    "crates/audio-boxes",
    "crates/audio-patch",
    "crates/audio-hash",
    "crates/audio-host",
    "crates/fpenv",
    "crates/visual-core",
    "crates/visual-boxes",
    "crates/visual-hash",
    "crates/visual-host",
    "crates/visual-gpu",
    "crates/visual-testkit",
    "crates/visual-cli",
    "crates/alloc-counter",
    "crates/audio-testkit",
    "crates/audio-battery",
    "crates/audio-cli",
    "bindings/audio-wasm",
    "bindings/visual-wasm",
]
resolver = "3"
