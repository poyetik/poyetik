[package]
name = "xtask"
description = "Poyetik project automation: `cargo xtask check` runs every quality check, as CI and the pre-push hook do"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["automation"]
categories = ["development-tools"]

# Its root is all its code, which tests/ run through the binary: no unit-test build of it,
# one compilation and one link less at every build of a mutant. xtask's untested targets
# gate refuses `test = false` on a root that declares a module.
[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde_json = "1"

[lints]
workspace = true
