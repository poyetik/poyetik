[package]
name = "audio-core"
description = "Poyetik engine core: the box contract, strong types and the deterministic execution plan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["audio", "dsp", "patching"]
categories = ["multimedia::audio", "no-std"]

[dependencies]
libm = { workspace = true }

[dev-dependencies]
# Reads the shared test matrix (conformance/test-matrix.json) in the unit tests. Not
# audio-battery, which depends on this crate: a second copy of it would bring a second,
# distinct `SampleRate` type.
serde_json = "1"
# Forces a host that flushes subnormal numbers in the limiter's host differential, which
# compares its private control state, visible to the unit tests only.
fpenv = { path = "../fpenv" }

[lints]
workspace = true
