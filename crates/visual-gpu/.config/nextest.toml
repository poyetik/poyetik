# The slow group of this workspace's tests, run last in every mutant run (cargo-nextest,
# which only cargo-mutants runs here; xtask's MUTANT_TEST_TOOL). Each mutant's tests stop at
# their first failure, so a mutant a fast test catches stops in seconds instead of waiting
# behind the slow tests. A priority only orders the tests: every test still runs when no
# test fails, so no verdict depends on this file (xtask's nextest config gate allows nothing
# else in it).
#
# The group: every test of this workspace that took at least xtask's SLOW_TEST_MILLIS in the
# unmutated baseline of its mutation run when this file was made (2026-11-18). At the end of
# each mutation run, xtask suggests the tests to move in (SLOW_TEST_SUGGESTED_MILLIS or more)
# or out (under FAST_TEST_MILLIS) of it, from that run's baseline (crates/xtask/src/test_order.rs).

[[profile.default.overrides]]
filter = 'binary_id(=visual-gpu) & test(=bench::tests::measures_this_gpu_by_its_clock)'
priority = -1

[[profile.default.overrides]]
filter = 'binary_id(=visual-gpu) & test(=bench::tests::reads_and_writes_the_baseline_below_the_root)'
priority = -1

[[profile.default.overrides]]
filter = 'binary_id(=visual-gpu) & test(=tests::costs_the_same_transfers_on_every_gpu_of_the_same_limits)'
priority = -1

[[profile.default.overrides]]
filter = 'binary_id(=visual-gpu) & test(=tests::encodes_for_display_as_the_cpu_at_every_threshold)'
priority = -1

[[profile.default.overrides]]
filter = 'binary_id(=visual-gpu) & test(=tests::encodes_in_bands_of_any_size)'
priority = -1

[[profile.default.overrides]]
filter = 'binary_id(=visual-gpu) & test(=tests::encodes_the_square_it_renders_as_the_cpu_across_the_matrix)'
priority = -1

[[profile.default.overrides]]
