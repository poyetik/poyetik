[package]
name = "audio-host"
description = "The Poyetik engine as a host drives it: a patch loaded, rendered block by block in a render format through the output stage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["audio", "dsp", "engine"]
categories = ["multimedia::audio", "no-std"]

[dependencies]
audio-core = { path = "../audio-core" }
audio-boxes = { path = "../audio-boxes" }
audio-patch = { path = "../audio-patch" }

[dev-dependencies]
# Hashes the live vector's renders, which the WebAssembly module's tests hash too.
audio-hash = { path = "../audio-hash" }
audio-testkit = { path = "../audio-testkit" }
# Reads the conformance cases, which the tests render at every engine block of the matrix.
serde_json = "1"

[lints]
workspace = true
