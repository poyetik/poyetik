[package]
name = "engine-cli"
description = "Offline renderer: renders conformance cases to WAV files and checks their hashes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository = "https://example.invalid/poyetik"
keywords = ["audio", "render", "conformance"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
engine-core = { path = "../engine-core" }
engine-hash = { path = "../engine-hash" }
engine-objects = { path = "../engine-objects" }
engine-patch = { path = "../engine-patch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
