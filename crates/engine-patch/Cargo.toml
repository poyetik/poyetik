[package]
name = "engine-patch"
description = "Reads patches in the JSON patch format (spec/patch-format.md) into engine-core patches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository = "https://example.invalid/poyetik"
keywords = ["audio", "patching", "json"]
categories = ["multimedia::audio", "no-std", "parser-implementations"]

[dependencies]
engine-core = { path = "../engine-core" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "float_roundtrip"] }

[lints]
workspace = true
