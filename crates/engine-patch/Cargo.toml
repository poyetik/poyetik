[package]
name = "engine-patch"
description = "Reads patches in the JSON patch format (spec/patch-format.md) into engine-core patches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["audio", "patching", "json"]
categories = ["multimedia::audio", "no-std", "parser-implementations"]

[dependencies]
engine-core = { path = "../engine-core" }
# Exactly pinned: they read the parameter values a render computes from, so an update follows
# spec/engine-design.md decision 29 (bit-defining dependencies, dependencies.txt).
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc", "float_roundtrip"] }

[lints]
workspace = true
