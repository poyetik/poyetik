[package]
name = "visual-cli"
description = "Poyetik visual offline renderer: renders the visual conformance cases to image hashes, and checks or rewrites their reference hashes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["graphics", "conformance", "cli"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
visual-boxes = { path = "../visual-boxes" }
visual-core = { path = "../visual-core" }
visual-hash = { path = "../visual-hash" }

[lints]
workspace = true
