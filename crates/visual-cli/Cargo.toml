[package]
name = "visual-cli"
description = "Poyetik visual offline renderer: renders the visual conformance cases to image hashes, and checks or rewrites their reference hashes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["graphics", "conformance", "cli"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "visual-cli"
path = "src/main.rs"
test = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
visual-boxes = { path = "../visual-boxes" }
visual-core = { path = "../visual-core" }
visual-hash = { path = "../visual-hash" }

[dev-dependencies]
fpenv = { path = "../fpenv" }
visual-testkit = { path = "../visual-testkit" }

[lints]
workspace = true
