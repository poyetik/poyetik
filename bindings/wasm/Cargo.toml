[package]
name = "engine-wasm"
description = "poyetik engine for WebAssembly: a minimal C interface for browsers (AudioWorklet) and Node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository = "https://example.invalid/poyetik"
keywords = ["audio", "dsp", "webassembly"]
categories = ["multimedia::audio", "wasm"]

[lib]
# cdylib: the `.wasm` module; rlib: native tests of the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
engine-core = { path = "../../crates/engine-core" }
engine-objects = { path = "../../crates/engine-objects" }
engine-patch = { path = "../../crates/engine-patch" }

[dev-dependencies]
engine-testkit = { path = "../../crates/engine-testkit" }

[lints]
workspace = true
