[package]
name = "web-page"
description = "Poyetik's product module for the page of a browser: the visual library and the coordinating layer, one WebAssembly module (spec/engine-design.md, decision 33)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["graphics", "audio", "webassembly"]
categories = ["multimedia", "wasm"]

[lib]
# cdylib: the `.wasm` module; rlib: native tests of the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
audio-core = { path = "../../crates/audio-core" }
coordinator = { path = "../../crates/coordinator" }
visual-core = { path = "../../crates/visual-core" }
visual-wasm = { path = "../visual-wasm" }

[lints]
workspace = true
