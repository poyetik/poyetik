[package]
name = "visual-wasm"
description = "Poyetik visual library for WebAssembly: a minimal C interface rendering the square, for Node (browsers come with the playground)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = false
repository.workspace = true
keywords = ["graphics", "rendering", "webassembly"]
categories = ["graphics", "wasm"]

[lib]
# cdylib: the `.wasm` module; rlib: native tests of the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
visual-host = { path = "../../crates/visual-host" }

[dev-dependencies]
visual-boxes = { path = "../../crates/visual-boxes" }
visual-core = { path = "../../crates/visual-core" }
visual-hash = { path = "../../crates/visual-hash" }

[lints]
workspace = true
