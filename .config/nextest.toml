# The slow group of this workspace's tests, run last in every mutant run (cargo-nextest,
# which only cargo-mutants runs here; xtask's MUTANT_TEST_TOOL). Each mutant's tests stop at
# their first failure, so a mutant a fast test catches stops in seconds instead of waiting
# behind the slow tests. A priority only orders the tests: every test still runs when no
# test fails, so no verdict depends on this file (xtask's nextest config gate allows nothing
# else in it).
#
# The group: every test that took at least 0.5 s in the unmutated baseline of the last full
# mutation run (2026-11-18). At the end of each mutation run, xtask suggests the tests to
# move in (1 s or more) or out (under 0.25 s) of it, from that run's baseline.
#
# Since then, two limiter tests of audio-core that the next run found slow, measured again
# alone on an idle machine before adding them (2026-11-18, nextest with one job, three runs
# each): the growth set at its path's life boundary, 4.7 s, and the values of a change kept
# at a tail's end, 3.6 s. And after the live lookahead's redesign (2026-11-19, the run of
# `cargo xtask mutants --changed`, then each measured again alone, the test program at a
# load of about 20): the random law of every live setting in, 33.6 s in that baseline and
# 27.5 CPU-s alone, and the change from a settled limiter in, 1.7 s and 1.6; the values of
# a change kept in a release tail out, 0.18 s and 0.17, its changes shorter since. And once
# a lookahead set live is taken at the limiter's rest (2026-11-19, its tests of the warm
# start removed with it, each new or changed one measured alone, the debug test program,
# `/usr/bin/time`, at a load of about 4 to 12): the law of each rest against limiters always
# at its lookaheads in, 13.6 CPU-s, every window at rest where it rests 9.0, the replay of
# audio-host's heap phases 8.0, the samples from a rest 2.9, the last lookahead set alone
# 1.8, the lookahead pending while a state is not zero 1.0; the ceiling held with
# lookaheads set while it limits, renamed, 14.2. And with the rest's physical checks
# (2026-11-19, the same way, at a load of 7 to 9): a lookahead set on a used limiter at rest
# in, 8.3 CPU-s, and one held back by a release shortened late in its tail in, 2.2. And the
# tests of xtask's own harnesses that every targeted run of 2026-11-26 and 2026-11-27
# suggested (`cargo xtask mutants --changed`, under the load of the other runs, each at
# least 1 s in each of those baselines): the check stopped at each call that fails in, 9.0
# to 10.5 s, each gate at each read 1.3 to 2.1, the honest change mutated staged or not 1.4
# to 1.8, git read whatever the user's configuration 1.8 to 2.0, and three of the proof
# record's real-git tests 2.2 to 7.8. And the test of a box's values under every host mode
# (2026-11-27, the run of `cargo xtask mutants --changed`, the machine otherwise idle):
# 1.4 s in that baseline, in.

