# Quality: runs `cargo xtask check`, the check the pre-push hook runs once its own refusals pass.
# On demand, because the full check is long and commits are frequent: on a push only when the
# last commit's message contains [ci], on every pull request, and by hand (Run workflow).
name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo xtask check
    # A push runs the check only when its last commit asks for it with [ci].
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every action is pinned to a full commit (the tag it was taken from is in the comment)
    # and every tool to an exact version: a moved tag or a new release cannot change CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the history gate checks every commit message.
          fetch-depth: 0

      # Rust: the pinned stable toolchain comes from rust-toolchain.toml; the pinned
      # nightly is used only to measure branch coverage and to run Miri.
      - name: Install Rust toolchains
        run: |
          rustup show active-toolchain
          rustup toolchain install nightly-2026-11-01 --profile minimal --component llvm-tools-preview,miri,rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-deny@0.20.2

      # JavaScript: pnpm workspace at the root, Node and the Playwright browsers.
      # pnpm at the version of packageManager in package.json, Node at .node-version.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Playwright browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/roadmap exec playwright install --with-deps chromium firefox webkit

      - name: Every quality check
        run: cargo xtask check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: |
            mutants.out
            apps/*/coverage
            apps/*/reports
            apps/*/playwright-report
            apps/*/test-results
            bindings/*/coverage
            bindings/*/reports
            bindings/*/playwright-report
            bindings/*/test-results
          if-no-files-found: ignore
