# Quality: runs `cargo xtask check --full`: every check, every mutant, split into the parts of
# `cargo xtask list --full --parts`, one job each, in parallel; the parts gate of xtask proves
# that together they run every step of the full check once. The pre-push hook runs
# `cargo xtask check`, which mutation tests only the changes; only this run proves the rest.
# On demand, because the full check is long and commits are frequent: on a push only when the
# last commit's message holds [ci] alone on a line (xtask refuses it anywhere else), on every
# pull request, and by hand (Run workflow). A push whose marker names parts ([ci gates
# bindings-wasm], in the order of `cargo xtask list --full --parts`), or a run by hand given
# parts, checks only those, without the final part: never a full check.
# Every line of this file but its comments and blank lines is xtask's (`workflow_text`): the
# workflow gate refuses any other, an action's commit hash and its tag comment apart, which
# Dependabot updates. A change of CI is a change of xtask.
name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      parts:
        description: The parts to check, separated by spaces (cargo xtask list --full --parts, final apart); empty for every part
        type: string
        default: ''

permissions:
  contents: read

# A newer run of the check cancels the older one of the same ref; a run skipped by the marker
# condition below gets a group of its own, so that it never cancels a check in progress.
concurrency:
  group: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]') || contains(github.event.head_commit.message, '[ci ')) && format('quality-{0}', github.ref) || format('skipped-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # The parts to check, read by xtask (`cargo xtask ci-parts`): every part for a pull request
  # or a run by hand given none, else those named. The commit message and the input reach it
  # through the environment, never written into the script.
  parts:
    name: The parts to check
    # A push runs the check only when its last commit asks for it with a marker.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci]') || contains(github.event.head_commit.message, '[ci ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
      full: ${{ steps.parts.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: parts
          cache-on-failure: true
      - name: The parts asked for
        id: parts
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PARTS: ${{ inputs.parts }}
        run: cargo xtask ci-parts "$EVENT" "$MESSAGE" "$PARTS" >> "$GITHUB_OUTPUT"
  check:
    name: cargo xtask check --full --part ${{ matrix.part }}
    needs: parts
    # Only the parts read above, if any.
    if: needs.parts.outputs.parts != '[]'
    # The OS release is pinned (never `-latest`); the runner image itself still receives
    # GitHub's weekly updates, which no workflow can pin.
    runs-on: ubuntu-24.04
    # A guard against a hung job, temporarily wide: the oracle's mutation testing, the
    # longest part, took 56 minutes on one runner and did not finish in 90 on two others,
    # nor in 150 on a third (1308 of 1470 mutants, none surviving). Each job's timeout is
    # to be set from its part's measured duration once that part is split.
    timeout-minutes: 300
    strategy:
      # Every part runs whatever the others find, as the full check runs every step.
      fail-fast: false
      matrix:
        # The parts read above: for a full check, those of `cargo xtask list --full --parts`
        # but the final one, exactly.
        part: ${{ fromJSON(needs.parts.outputs.parts) }}
    # Every action is pinned to a full commit (the tag it was taken from is in the comment)
    # and every tool to an exact version: a moved tag or a new release of an action or a
    # tool cannot change CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the history gate checks every commit message.
          fetch-depth: 0
          # No credential is kept in the repository's configuration for later steps.
          persist-credentials: false

      # Rust: the pinned stable toolchain is installed from rust-toolchain.toml (rustup
      # 1.28 or later, given no name); the pinned nightly is used only to measure branch
      # coverage and to run Miri.
      - name: Install Rust toolchains
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-11-01 --profile minimal --component llvm-tools-preview,miri,rust-src
      # One cache per part: each builds something else (its own toolchain, profile or
      # target), so a cache shared by all would hold only what the first job to finish built.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.part }}
          # A failed, timed-out or cancelled run still saves what it built.
          cache-on-failure: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-deny@0.20.2

      # JavaScript: pnpm workspace at the root, Node and the Playwright browsers.
      # pnpm at the version of packageManager in package.json, Node at .node-version.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Playwright browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/roadmap exec playwright install --with-deps chromium firefox webkit

      # The runner has no sound card: Firefox plays live only through an audio server
      # (Chromium runs with its audio output disabled, WebKitGTK plays without one).
      # PulseAudio, which the image does not hold, at an exact version of the OS release:
      # an Ubuntu update of it fails here until the version is changed in xtask's
      # AUDIO_SINK. The last line names the
      # cause if the job is left without a default sink.
      - name: Start an audio server with a null sink
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pulseaudio=1:16.1+dfsg1-2ubuntu10.1
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
          pactl get-default-sink | grep --quiet --line-regexp null || { echo "::error::no audio sink: Firefox cannot play live (the runner has no sound card)"; exit 1; }

      - name: One part of the full check
        run: cargo xtask check --full --part ${{ matrix.part }}

      # A mutation shard's unviable mutants, which the final part reviews with every other
      # shard's (the other parts have none to upload).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unviable-${{ matrix.part }}
          path: mutants.out/unviable.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-${{ matrix.part }}
          path: |
            mutants.out
            target/coverage
            bindings/wasm/dist/engine.wasm
            tooling/*/coverage
            tooling/*/reports
            bindings/*/coverage
            bindings/*/reports
            apps/*/coverage
            apps/*/reports
            tooling/*/playwright-report
            tooling/*/test-results
            bindings/*/playwright-report
            bindings/*/test-results
            apps/*/playwright-report
            apps/*/test-results
          if-no-files-found: ignore

  final:
    name: cargo xtask check --full --part final
    # Once every part has passed, and only when every part ran: what needs them all.
    needs: [parts, check]
    if: needs.parts.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # Set by the same rule as the parts' timeout, from this job's own time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tools its preflight checks, as every part's (not the browsers, which it does not
      # check).
      - name: Install Rust toolchains
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-11-01 --profile minimal --component llvm-tools-preview,miri,rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-deny@0.20.2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Every shard's unviable mutants, one directory per artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unviable-*
          path: mutants.out/shards

      - name: The unviable mutants of every shard, reviewed together
        run: cargo xtask check --full --part final
