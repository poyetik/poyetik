# Quality: runs on every push, on every branch, and on every pull request.
# It runs exactly what the pre-push hook runs: `cargo xtask check`.
name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo xtask check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Rust: the pinned stable toolchain comes from rust-toolchain.toml; the pinned
      # nightly is used only to measure branch coverage.
      - name: Install Rust toolchains
        run: |
          rustup show active-toolchain
          rustup toolchain install nightly-2026-11-01 --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-mutants,cargo-deny

      # JavaScript: pnpm, Node and the Playwright browsers for the roadmap.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: roadmap/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: roadmap/pnpm-lock.yaml
      - name: Install Playwright browsers
        working-directory: roadmap
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Every quality check
        run: cargo xtask check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            mutants.out
            roadmap/coverage
            roadmap/reports
            roadmap/playwright-report
            roadmap/test-results
          if-no-files-found: ignore
