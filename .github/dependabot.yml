# Proposes dependency updates; every proposal goes through the full Quality workflow.
# Exactly xtask's `DEPENDABOT_CONFIG`: a change is made in both.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/visual-gpu
    schedule:
      interval: weekly
    # A release is proposed only once it is a week old, so that a hijacked one is likely
    # found and yanked first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release is proposed only once it is a week old, so that a hijacked one is likely
    # found and yanked first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is proposed only once it is a week old, so that a hijacked one is likely
    # found and yanked first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
