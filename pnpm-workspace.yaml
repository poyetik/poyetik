packages:
  - "apps/*"
  - "bindings/audio-wasm"
  - "tooling/*"

# A package version is installable only once it is a week old (in minutes), so that a
# hijacked release is likely found and yanked first. The top-level keys are xtask's
# (`PNPM_WORKSPACE_KEYS`): another setting, an exclusion from that age included, is a change
# of xtask.
minimumReleaseAge: 10080

# Versions forced for transitive development dependencies with known vulnerabilities,
# until their parents depend on fixed versions (checked by `pnpm audit` in the check).
overrides:
  "qs": "^6.16.1"
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"

# One version of each tool shared by several packages, referenced as "catalog:".
# @types/node follows the Node version the packages require (engines: >=22.18).
catalog:
  "@axe-core/playwright": "^4.14.0"
  "axe-core": "^4.14.0"
  "@playwright/test": "^1.65.0"
  "@stryker-mutator/core": "^10.1.1"
  "@stryker-mutator/vitest-runner": "^10.1.1"
  "@types/node": "~22.18.0"
  "@vitest/coverage-v8": "^5.1.0"
  "eslint": "^10.14.0"
  "jsdom": "^31.0.0"
  "typescript": "~6.0.3"
  "vitest": "^5.1.0"
